name: Test Copilot Reviewer

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: 'Test case ID (e.g., CR-001)'
        required: false
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.review.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Find copilot configs
        id: configs
        run: |
          configs=$(find . -name "copilot-*.json" -type f | grep -v node_modules || true)
          if [ -z "$configs" ]; then
            echo "No copilot configs found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "Found configs: $configs"
            echo "found=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Mock review (no Claude API in tests)
        id: review
        if: steps.configs.outputs.found == 'true'
        run: |
          # Mock review - in real tests would call Claude API
          echo "Mock review complete"
          echo "passed=true" >> $GITHUB_OUTPUT
          echo "score=85" >> $GITHUB_OUTPUT
          
      - name: Skip if no configs
        if: steps.configs.outputs.found != 'true'
        run: |
          echo "No copilot configs - skipping review"
          echo "passed=true" >> $GITHUB_OUTPUT
